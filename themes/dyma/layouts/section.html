{{ define "main" }}
  <header class="page-intro">
    <h1 class="page-heading">{{ .Title }}</h1>
    {{ with .Content }}
      <div class="markdown-body">{{ . }}</div>
    {{ end }}
  </header>
  <ul class="entry-list">
    {{ range .Pages }}
      <li class="entry">
        <h2 class="entry-title">
          <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        </h2>
        {{ with .Description }}
          <p class="entry-summary">{{ . }}</p>
        {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
