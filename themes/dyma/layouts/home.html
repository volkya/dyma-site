{{ define "main" }}
  {{ $home := site.Params.home }}

  <section class="hero">
    <p class="hero-kicker">{{ $home.heroSubtitle }}</p>
    <h1 class="hero-title">{{ $home.heroTitle }}</h1>

    <div class="hero-body">
      {{ range $home.heroParagraphs }}
        <p>{{ . }}</p>
      {{ end }}
    </div>

    <div class="stack" aria-label="{{ $home.stackAriaLabel }}">
      <span class="stack-label">{{ $home.stackLabel }}</span>
      <ul class="stack-items">
        {{ range $home.stack }}
          <li>{{ . }}</li>
        {{ end }}
      </ul>
    </div>

    <div class="hero-actions">
      <a class="btn-pill btn-pill--solid" href="{{ `/projects/` | relURL }}">{{ $home.ctaProjects }}</a>
      <a class="btn-pill" href="{{ `/cv/` | relURL }}">{{ $home.ctaCv }}</a>
    </div>
  </section>
{{ end }}
