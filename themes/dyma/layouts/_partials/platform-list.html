{{- $page := .page -}}
{{- $class := .class | default "" -}}
{{- with $page.Params.platforms -}}
  <ul class="tag-list{{ with $class }} {{ . }}{{ end }}" aria-label="Published on">
    {{- range . -}}
      <li>
        <a
          class="meta-pill"
          href="{{ .url }}"
          target="_blank"
          rel="noopener noreferrer"
        >{{ .name }}</a>
      </li>
    {{- end -}}
  </ul>
{{- end -}}
